<!DOCTYPE html>
<html lang="en">
<head>
    <title>Movie Listing Portal</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background-color: white;
            padding: 40px;
            display: flex;
            justify-content: center;
        }


        #movie-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            max-width: 1000px;
            width: 100%;
        }


        .movie-card {
            display: flex;
            border: 1px solid white;
            border-radius: 4px;
            padding: 12px;
            background-color: #fff;
            align-items: center;
            gap: 20px;
        }


        .movie-poster, .movie-details {
            display: flex;
            flex-direction: column;
        }


        .movie-poster img {
            width: 100px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
        }


        .movie-details h3 {
            font-size: 18px;
            color: #222;
            margin-bottom: 15px;
            font-weight: 700;
        }


        .movie-details p {
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
        }


        .book-btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: fit-content;
        }


        .book-btn:hover {
            background-color: #e63956;
        }

    </style>
</head>
<body>

    <div id="movie-container">

        <div class="movie-card">
            <div class="movie-poster">
